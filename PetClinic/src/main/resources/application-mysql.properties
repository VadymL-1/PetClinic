# database init, supports mysql too
database=mysql
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:petclinic}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:petclinic}
spring.datasource.password=${DB_PASS:petclinic}
spring.datasource.initialization-mode=always
